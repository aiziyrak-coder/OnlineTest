# Ishga tushirish: docker compose up --build
# Brauzer: http://127.0.0.1:8080  ·  Loglar: docker compose logs -f
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: onlinetest
      POSTGRES_USER: onlinetest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres-password}
    ports:
      # Host'dan ulanish (psql / testlar) uchun ochilgan. Port band bo'lsa:
      #   .env:  DB_PORT=5433
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlinetest"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: onlinetest:local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      # Host porti sozlanadi: bir serverda boshqa xizmat 8080 ni band qilgan
      # bo'lishi mumkin (masalan front-nginx). Konteyner ichida doim 8080.
      #   .env:  APP_PORT=8090
      - "${APP_PORT:-8080}:8080"
    env_file:
      - backend/.env
    volumes:
      # Talabalar kontingenti (Excel) — data/ .gitignore'da, shuning uchun
      # image build vaqtida ichiga tushmaydi. Bind mount: host qayta ishga
      # tushirilsa/deploy qilinsa ham fayllar yo'qolmaydi (docker cp'dan farqli).
      - ./data:/app/data:ro
    environment:
      # Prod: .env da DJANGO_DEBUG=0. Parolda @ bo'lsa DATABASE_URL ni URL-encode qiling
      # (masalan @@ → %40%40); aks holda postgres://user:pass@@db/... noto'g'ri parse bo'ladi.
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      IDENTITY_VERIFY_DEBUG_LOG: ${IDENTITY_VERIFY_DEBUG_LOG:-0}
      DATABASE_URL: ${DATABASE_URL:-postgres://onlinetest:dev-postgres-password@db:5432/onlinetest}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-docker-dev-jwt-secret-min-24-chars}
      # 100+ parallel imtihon starti: ko'proq ASGI worker
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-8}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-300}
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-120}
      FACULTY_AI_GENERATE_SLOTS: ${FACULTY_AI_GENERATE_SLOTS:-2}
      # OPENAI_* va IMENTOR_* faqat backend/.env (env_file) dan — environment da
      # qayta yozmang: ${OPENAI_API_KEY:-} bo'sh bo'lib .env dagi haqiqiy kalitni
      # container ichida o'chirib yuboradi (`environment:` `env_file:` dan ustun
      # turadi). Aynan shu xato ilgari IMENTOR_API_KEY bilan topilgan edi —
      # OPENAI_API_KEY ham xuddi shu sababdan bo'sh bo'lib qolgan edi.
    networks:
      - default
      - imentor_net

  # Celery worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: onlinetest:local
    restart: unless-stopped
    entrypoint: ["/app/docker-worker-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - backend/.env
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DATABASE_URL: ${DATABASE_URL:-postgres://onlinetest:dev-postgres-password@db:5432/onlinetest}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-docker-dev-jwt-secret-min-24-chars}
      # OPENAI_* faqat backend/.env (env_file) dan — sabab yuqoridagi `app` servisidagi izohda.
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-120}
    networks:
      - default
      - imentor_net

  # Celery beat — davriy tasklarni (proctor.sweep_stale_sessions) rejalashtiradi.
  # DIQQAT: faqat bitta nusxa ishlashi kerak (replicas: 1 default) — bir nechta
  # beat jarayoni bir xil taskni bir necha marta navbatga qo'yib yuboradi.
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: onlinetest:local
    restart: unless-stopped
    entrypoint: ["/app/docker-beat-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - backend/.env
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DATABASE_URL: ${DATABASE_URL:-postgres://onlinetest:dev-postgres-password@db:5432/onlinetest}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-docker-dev-jwt-secret-min-24-chars}

  # Playwright E2E — web tarafni haqiqiy brauzerda sinaydi (login -> PreExamCheck
  # -> ExamRoom -> natija). Odatiy `docker compose up`da ISHLAMAYDI ("test" profile) —
  # qo'lda ishga tushiriladi:
  #   docker compose --profile test run --rm e2e
  e2e:
    build:
      context: ./e2e
    profiles: ["test"]
    depends_on:
      app:
        condition: service_started
    # app'ning tarmoq nazratini bo'lishadi — shunda brauzer 127.0.0.1:8080'ga
    # murojaat qiladi (Chromium buni har doim "xavfsiz kontekst" deb hisoblaydi,
    # getUserMedia uchun HTTPS yoki maxsus flag shart emas).
    network_mode: "service:app"
    environment:
      BASE_URL: http://127.0.0.1:8080
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-DemoFJSTI2026!}
      # Ixtiyoriy "real yuz" rejimi (standart: bo'sh — mock identity-compare
      # ishlatiladi). Yoqish uchun: e2e/fixtures/ ichiga fake-camera video qo'yib,
      # E2E_FAKE_VIDEO_PATH=/fixtures/<fayl> va E2E_MOCK_IDENTITY=0 bilan chaqiring.
      # e2e/fixtures/ shaxsiy foto/video bo'lishi mumkin — git'ga HECH QACHON
      # commit qilinmaydi (.gitignore'da).
      E2E_FAKE_VIDEO_PATH: ${E2E_FAKE_VIDEO_PATH:-}
      E2E_MOCK_IDENTITY: ${E2E_MOCK_IDENTITY:-1}
    volumes:
      - ./e2e/playwright-report:/e2e/playwright-report
      - ./e2e/test-results:/e2e/test-results
      - ./e2e/fixtures:/fixtures:ro

volumes:
  pg-data:
  redis-data:

networks:
  imentor_net:
    # Bir serverdagi iMentor nginx (imentor-nginx-1) — RAG MCQ uchun.
    # Tarmoq yo'q bo'lsa: docker network create imentor_default
    external: true
    name: imentor_default
