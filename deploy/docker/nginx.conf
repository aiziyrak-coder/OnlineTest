worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    access_log /dev/stdout;
    include /etc/nginx/mime.types;
    # .mjs — ES modul. Standart mime.types da yo'q, `application/octet-stream`
    # bilan kelsa brauzer modul sifatida YUKLAMAYDI (onnxruntime-web ning
    # ort-wasm-*.mjs loader'i shu sabab ishlamay qolardi).
    # wasm allaqachon mime.types da bor — qayta yozilsa nginx warn beradi.
    types {
        text/javascript mjs;
    }
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;
    keepalive_requests 1000;
    client_max_body_size 55m;

    # Silero VAD runtime'i (~13MB wasm) va ONNX modeli (~2.3MB) siqilganda
    # ~5MB ga tushadi. Bir marta yuklanadi va keshlanadi.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/wasm
        application/octet-stream
        image/svg+xml;

    upstream django_api {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://django_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            # Start/prewarm AI (faqat bank yo'q bo'lsa) — uzoq; prewarm bo'lsa tez
            proxy_read_timeout 900s;
        }

        location /django-admin/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://django_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://django_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        # Silero VAD modeli va ONNX runtime — o'zgarmas fayllar, uzoq keshlansin
        # (talaba har imtihonda 15MB qayta yuklamasin).
        # MUHIM: `mediapipe` shu blokda bo'lishi SHART. Aks holda u pastdagi
        # `location /` ga tushadi va yetishmagan model fayli uchun 404 emas,
        # `index.html` (200 bilan) qaytadi — MediaPipe HTML'ni model deb o'qib
        # tushunarsiz xato beradi va nazorat jimgina o'chadi.
        location ~ ^/(models|ort|vad|mediapipe)/ {
            root /app/frontend_dist;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }

        # Content-hashed build assets (index-<hash>.js/.css) — abadiy keshlansin.
        # Har deployda fayl nomi (hash) o'zgaradi, shuning uchun immutable xavfsiz.
        location /assets/ {
            root /app/frontend_dist;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            root /app/frontend_dist;
            # SPA qobig'i (index.html) hech qachon keshda qotib qolmasin — har
            # deployda yangi build darrov ko'rinsin. Assetlar hash bilan, ular
            # yuqorida immutable. Bu yerda faqat index.html va boshqa root fayllar.
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri $uri/ /index.html;
        }
    }
}
